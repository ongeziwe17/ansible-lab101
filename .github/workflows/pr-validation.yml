---
name: PR Validation

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Validation only reads the checkout and does not use repository secrets.
permissions:
  contents: read

jobs:
  yaml:
    name: PR Validation / YAML
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Lint YAML
        run: yamllint .

  ansible:
    name: PR Validation / Ansible
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Lint Ansible content
        run: ansible-lint ansible-playbooks/
      - name: Validate inventory contract
        run: python scripts/validate-inventories.py
      - name: Parse inventories
        run: |
          for inventory in ansible-playbooks/inventories/{qa,prod}/hosts.yml; do
            ansible-inventory -i "$inventory" --list >/dev/null
            ansible-inventory -i "$inventory" --graph
          done
      - name: Check syntax and resolution
        run: |
          for inventory in ansible-playbooks/inventories/{qa,prod}/hosts.yml; do
            ansible-playbook -i "$inventory" ansible-playbooks/site.yml --syntax-check
            ansible-playbook -i "$inventory" ansible-playbooks/site.yml --list-hosts
            ansible-playbook -i "$inventory" ansible-playbooks/site.yml --list-tasks
          done

  repository:
    name: PR Validation / Repository
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Compose configuration only
        run: docker compose -f compose.yml config --quiet
      - name: Lint all shell scripts
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 --no-run-if-empty shellcheck

  security:
    name: PR Validation / Security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required:
    name: PR Validation / Required
    if: ${{ always() }}
    needs: [yaml, ansible, repository, security]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every validation job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$RESULTS" = "success success success success" || {
            echo "One or more required validation jobs did not succeed: $RESULTS"
            exit 1
          }
