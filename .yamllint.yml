---
extends: default

ignore-from-file: .gitignore

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  comments:
    min-spaces-from-content: 1

  comments-indentation: false

  document-start:
    level: warning

  indentation:
    spaces: 2
    indent-sequences: true

  line-length:
    max: 120
    level: warning

  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

  truthy:
    allowed-values:
      - "true"
      - "false"
    check-keys: false
