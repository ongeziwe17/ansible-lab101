---
- name: Validate Linux managed nodes
  hosts: linux_nodes
  gather_facts: true

  tasks:
    - name: Update apt cache and install python3
      ansible.builtin.apt:
        update_cache: yes
        name: python3-apt

    - name: Confirm Python is available for Ansible modules
      ansible.builtin.command: python3 --version
      changed_when: false

    - name: Confirm become can run privileged commands
      ansible.builtin.command: whoami
      register: become_identity
      changed_when: false

    - name: Show become identity
      ansible.builtin.debug:
        var: become_identity.stdout

    - name: Install NGINX package
      apt:
        name: nginx
        state: present

    - name: Ensure NGINX is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes
