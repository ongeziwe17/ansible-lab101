name: ansible-lab

services:
  ansible-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
      args:
        DEVOPS_USER: ${DEVOPS_USER:-devops}
        DEVOPS_PASSWORD: ${DEVOPS_PASSWORD:-devops}

    image: ansible-controller:lab
    container_name: ansible-controller
    hostname: ansible-controller

    stdin_open: true
    tty: true

    working_dir: /workspace

    volumes:
      - ./ansible-playbooks:/workspace
      - controller_ssh:/home/${DEVOPS_USER:-devops}/.ssh

    networks:
      - ansible_lab

    depends_on:
      lin-node1:
        condition: service_healthy
      lin-node2:
        condition: service_healthy
      lin-node3:
        condition: service_healthy

  lin-node1:
    build:
      context: ./nodes
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        DEVOPS_USER: ${DEVOPS_USER:-devops}
        DEVOPS_PASSWORD: ${DEVOPS_PASSWORD:-devops}

    image: ansible-node:${UBUNTU_VERSION:-22.04}
    container_name: lin-node1
    hostname: lin-node1

    networks:
      - ansible_lab

    healthcheck: &sshd_healthcheck
      test: ["CMD-SHELL", "pgrep -x sshd > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  lin-node2:
    build:
      context: ./nodes
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        DEVOPS_USER: ${DEVOPS_USER:-devops}
        DEVOPS_PASSWORD: ${DEVOPS_PASSWORD:-devops}

    image: ansible-node:${UBUNTU_VERSION:-22.04}
    container_name: lin-node2
    hostname: lin-node2

    networks:
      - ansible_lab

    healthcheck: *sshd_healthcheck

  lin-node3:
    build:
      context: ./nodes
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        DEVOPS_USER: ${DEVOPS_USER:-devops}
        DEVOPS_PASSWORD: ${DEVOPS_PASSWORD:-devops}

    image: ansible-node:${UBUNTU_VERSION:-22.04}
    container_name: lin-node3
    hostname: lin-node3

    networks:
      - ansible_lab

    healthcheck: *sshd_healthcheck

networks:
  ansible_lab:
    name: ansible_lab_net
    driver: bridge

volumes:
  controller_ssh:
    name: ansible_controller_ssh
