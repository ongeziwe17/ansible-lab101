---
name: ansible-lab

services:
  ansible-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
      args:
        DEVOPS_USER: ${DEVOPS_USER:-devops}
        DEVOPS_PASSWORD: ${DEVOPS_PASSWORD:-devops}

    image: ansible-controller:lab
    container_name: ansible-controller
    hostname: ansible-controller

    stdin_open: true
    tty: true

    working_dir: /workspace

    volumes:
      - ./ansible-playbooks:/workspace
      - controller_ssh:/home/${DEVOPS_USER:-devops}/.ssh

    networks:
      - ansible_lab

    depends_on:
      qa-web-01:
        condition: service_healthy
      qa-app-01:
        condition: service_healthy
      qa-mon-01:
        condition: service_healthy

  qa-web-01:
    build:
      context: ./nodes
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        DEVOPS_USER: ${DEVOPS_USER:-devops}
        DEVOPS_PASSWORD: ${DEVOPS_PASSWORD:-devops}

    image: ansible-node-qa-web-01:${UBUNTU_VERSION:-22.04}
    container_name: qa-web-01
    hostname: qa-web-01

    networks:
      - ansible_lab

    healthcheck: &sshd_healthcheck
      test: ["CMD-SHELL", "pgrep -x sshd > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10

  qa-app-01:
    build:
      context: ./nodes
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        DEVOPS_USER: ${DEVOPS_USER:-devops}
        DEVOPS_PASSWORD: ${DEVOPS_PASSWORD:-devops}

    image: ansible-node-qa-app-01:${UBUNTU_VERSION:-22.04}
    container_name: qa-app-01
    hostname: qa-app-01

    networks:
      - ansible_lab

    healthcheck: *sshd_healthcheck

  qa-mon-01:
    build:
      context: ./nodes
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        DEVOPS_USER: ${DEVOPS_USER:-devops}
        DEVOPS_PASSWORD: ${DEVOPS_PASSWORD:-devops}

    image: ansible-node-qa-mon-01:${UBUNTU_VERSION:-22.04}
    container_name: qa-mon-01
    hostname: qa-mon-01

    networks:
      - ansible_lab

    healthcheck: *sshd_healthcheck

networks:
  ansible_lab:
    name: ansible_lab_net
    driver: bridge

volumes:
  controller_ssh:
    name: ansible_controller_ssh
